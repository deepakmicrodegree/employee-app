<div class="container">
  <h1>Employee Management System</h1>

  <button (click)="showCreateForm()" class="btn-add">+ Add New Employee</button>

  <!-- Form Section -->
  <div *ngIf="showForm" class="form-section">
    <h2>{{ isEdit ? 'Edit Employee' : 'Create New Employee' }}</h2>
    <form>
      <div class="form-group">
        <label>Name:</label>
        <input
          type="text"
          [(ngModel)]="isEdit ? selectedEmployee!.name : newEmployee.name"
          name="name"
          placeholder="Enter employee name"
          required
        />
      </div>

      <div class="form-group">
        <label>Email:</label>
        <input
          type="email"
          [(ngModel)]="isEdit ? selectedEmployee!.email : newEmployee.email"
          name="email"
          placeholder="Enter email address"
          required
        />
      </div>

      <div class="form-group">
        <label>Department:</label>
        <input
          type="text"
          [(ngModel)]="isEdit ? selectedEmployee!.department : newEmployee.department"
          name="department"
          placeholder="Enter department"
          required
        />
      </div>

      <div class="form-buttons">
        <button
          type="button"
          (click)="isEdit ? updateEmployee() : createEmployee()"
          class="btn-submit"
        >
          {{ isEdit ? 'Update' : 'Create' }}
        </button>
        <button type="button" (click)="resetForm()" class="btn-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Employee List Section -->
  <div class="list-section">
    <h2>Employee List</h2>
    <table *ngIf="employees.length > 0; else noEmployees" class="employee-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let employee of employees">
          <td>{{ employee.id }}</td>
          <td>{{ employee.name }}</td>
          <td>{{ employee.email }}</td>
          <td>{{ employee.department }}</td>
          <td>
            <button (click)="editEmployee(employee)" class="btn-edit">Edit</button>
            <button (click)="deleteEmployee(employee.id)" class="btn-delete">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #noEmployees>
      <p class="no-employees">No employees found. Click "Add New Employee" to create one.</p>
    </ng-template>
  </div>
</div>
