version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "========================================"
      - echo "Pre-Build Phase Starting"
      - echo "========================================"
      - java -version
      - mvn -version

  build:
    commands:
      - echo "========================================"
      - echo "Build Phase Starting"
      - echo "========================================"
      - cd backend
      - mvn clean package -DskipTests

  post_build:
    commands:
      - echo "========================================"
      - echo "Post-Build Phase Starting"
      - echo "========================================"
      - echo "Build completed successfully"

artifacts:
  files:
    - backend/target/employee-app-1.0.0.jar
  discard-paths: no
