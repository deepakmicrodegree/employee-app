version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 18
    commands:
      - echo "Installing backend and frontend dependencies..."
      - if [ ! -f backend/pom.xml ]; then echo "ERROR: Backend project is incomplete."; echo "Missing backend/pom.xml."; exit 1; fi
      - if [ ! -f frontend/angular.json ]; then echo "ERROR: Angular workspace is incomplete."; echo "Missing frontend/angular.json."; exit 1; fi
      - cd backend && mvn -B dependency:go-offline -Dmaven.test.skip=true
      - cd ../frontend && npm install

  build:
    commands:
      - echo "Building backend application..."
      - cd backend && mvn -B clean package -Dmaven.test.skip=true
      - echo "Building Angular frontend..."
      - cd ../frontend && npm run build
      - echo "Build completed on `date`"

  post_build:
    commands:
      - echo "===== BUILD SUMMARY ====="
      - ls -lh backend/target || true
      - ls -R frontend/dist || true

artifacts:
  files:
    - backend/target/*.jar
    - frontend/dist/**/*
  name: EmployeeAppBuild

cache:
  paths:
    - '/root/.m2/**/*'
    - '/root/.npm/**/*'
