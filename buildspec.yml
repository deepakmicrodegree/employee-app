version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing dependencies..."
      - cd backend && mvn clean install -DskipTests

  build:
    commands:
      - echo "Building application..."
      - mvn clean package -DskipTests
      - echo "Build completed on `date`"

  post_build:
    commands:
      - echo "Build succeeded"

artifacts:
  files:
    - backend/target/employee-app-1.0.0.jar
    - backend/target/employee-app-1.0.0.jar.original
  name: EmployeeAppBuild

cache:
  paths:
    - '/root/.m2/**/*'
