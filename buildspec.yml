version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 18

  pre_build:
    commands:
      - echo "========================================"
      - echo "Pre-Build Phase Starting"
      - echo "========================================"
      - java -version
      - mvn -version
      - node -v
      - npm -v

  build:
    commands:
      - echo "========================================"
      - echo "Build Phase Starting"
      - echo "========================================"
      - echo "--- Backend Build ---"
      - cd backend
      - mvn clean package -DskipTests
      - cd ..
      - echo "--- Frontend Build ---"
      - cd frontend
      - if [ ! -f angular.json ]; then
          echo "ERROR: Angular workspace is incomplete.";
          echo "Missing angular.json.";
          exit 1;
        fi
      - npm install
      - npm run build

  post_build:
    commands:
      - echo "========================================"
      - echo "Post-Build Phase Starting"
      - echo "========================================"
      - echo "Build completed successfully"

artifacts:
  files:
    - backend/target/employee-app-1.0.0.jar
    - frontend/dist/**/*
  discard-paths: no
